<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Variaveis e Calculos</title>
    <link rel="stylesheet" href="./css/style.css"/>
</head>
<body>
    <div class="container">
        
        <h2>Boas Vindas!</h2>
        <!--Seção do nome-->
        <div class="form-group">
          <label form="nome"> Digite seu nome: </label>
          <input type="text" id="nome" placeholder="Ex: Gustavo"/>
          <button onclick="SaudarCliente()">Enviar Nome</button>


    </div>
    <h3 id="mensagem-boas-vindas"></h3>
    <hr />

    <!---Seçoes das Operações -->
    <div class="form-group">
        <label for="num1">Primeiro número:</label>
        <input type="number" id="num1" placeholder="Ex: 10"/>

         <label for="num2">Segundo número:</label>
        <input type="number" id="num2" placeholder="Ex: 5"/>

        <button onclick="calcular()">Calcular</button>
        
      </div>
      <!--Resultados-->
      <div id="resultados" class="resultados"></div>

    </div>
<script src="./javascript/script.js"></script>

</body>
</html>
